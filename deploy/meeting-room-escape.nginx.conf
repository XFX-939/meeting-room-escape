server {
    listen 80;
    listen [::]:80;
    server_name escape.xiangfuxing.tech;

    root /var/www/meeting-room-escape/current;
    index index.html;

    access_log /var/log/nginx/meeting-room-escape.access.log;
    error_log /var/log/nginx/meeting-room-escape.error.log;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
